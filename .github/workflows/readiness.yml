name: Portable readiness and learning

on:
  push:
    branches: [main, codex/mra-platform-codebase]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-readiness:
    name: Teaching UI and wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install core and console dependencies only
        run: python -m pip install --disable-pip-version-check '.[console]' build
      - name: Check portable fictional teaching routes and boundaries
        run: python -B -m unittest discover -s tests -p test_portable_assurance.py -v
      - name: Build the wheel
        run: python -m build --wheel --outdir .local/portable-dist
      - name: Install the built wheel into a separate target
        run: >-
          python -c "from pathlib import Path; import subprocess, sys;
          wheels=list(Path('.local/portable-dist').glob('*.whl'));
          assert len(wheels)==1, wheels;
          subprocess.run([sys.executable, '-m', 'pip', 'install', '--no-deps', '--target',
          '.local/portable-wheel', str(wheels[0])], check=True)"
      - name: Verify installed package origins, assets and finite demo flow
        run: python -I -B scripts/check_portable_assurance.py --installed-target .local/portable-wheel
