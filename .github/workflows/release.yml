name: Draft release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  formal:
    name: Lean protocol proof
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and audit Lean proof terms
        uses: leanprover/lean-action@v1.6.1
        with:
          lake-package-directory: formal/lean
          auto-config: false
          build: true
          test: false
          lint: false
          axiom-audit: true
          axiom-audit-root: MRAP
          axiom-audit-allow: propext,Quot.sound
      - name: Verify theorem inventory and toolchain boundary
        run: python scripts/verify_formal_protocol.py

  required-profile:
    name: Required government profile (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-path: .local/pipeline-release/bin/python
            build-profile: linux
          - os: windows-latest
            python-path: .local/pipeline-release/Scripts/python.exe
            build-profile: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bootstrap required release test environment
        run: python scripts/setup_pipeline.py --profile console --venv .local/pipeline-release
      - name: Install hash-pinned build verifier parser
        shell: bash
        run: >-
          ${{ matrix.python-path }} -m pip install --require-hashes --only-binary=:all: --no-deps -r deploy/build/verification-runtime.requirements.txt
      - name: Verify public wheel bundle and current dependency advisories
        shell: bash
        run: ${{ matrix.python-path }} -B scripts/verify_build_supply_chain.py --manifest deploy/build/${{ matrix.build-profile }}-cp312.json --download --scan-pypi --output .local/release-supply-chain
      - name: Retain public dependency inventory and advisory evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-supply-chain-${{ matrix.os }}-${{ github.run_attempt }}
          path: .local/release-supply-chain/*.json
          include-hidden-files: true
          if-no-files-found: error
      - name: Run required government profile without skips
        shell: bash
        run: ${{ matrix.python-path }} -B scripts/run_required_tests.py --profile government --output .local/release-required
      - name: Require complete government test evidence
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import stat

          evidence = Path(".local/release-required")
          for name in ("tests.log", "result.json"):
              path = evidence / name
              try:
                  info = path.lstat()
              except FileNotFoundError:
                  raise SystemExit(f"Required test evidence is missing: {path}")
              if (not stat.S_ISREG(info.st_mode) or info.st_size == 0
                      or getattr(info, "st_file_attributes", 0) & 0x400):
                  raise SystemExit(f"Required test evidence must be a nonempty regular file: {path}")
          result = json.loads((evidence / "result.json").read_text(encoding="utf-8"))
          if (not isinstance(result, dict) or result.get("profile") != "government"
                  or result.get("status") not in {"passed", "failed"}):
              raise SystemExit("Required test evidence has an invalid profile or status")
          PY
      - name: Retain required release test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-government-required-${{ matrix.os }}-${{ github.run_attempt }}
          path: |
            .local/release-required/tests.log
            .local/release-required/result.json
          include-hidden-files: true
          if-no-files-found: error

  release:
    needs: [formal, required-profile]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Require an annotated release tag from main
        run: |
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main
          git cat-file -e "refs/tags/${GITHUB_REF_NAME}^{tag}"
      - name: Require tag and package versions to match
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          PYTHONPATH=src python - <<'PY'
          import os
          import runpy

          version = runpy.run_path("src/model_release_assurance/version.py")["VERSION"]
          expected = os.environ["RELEASE_TAG"].removeprefix("v")
          if version != expected:
              raise SystemExit(f"tag {expected!r} does not match package version {version!r}")
          PY
      - name: Install runtime and release tools
        run: |
          python -m pip install --disable-pip-version-check -r requirements.lock
          python -m pip install --disable-pip-version-check -r requirements-experiments.txt
          python -m pip install --disable-pip-version-check -r requirements-console.txt
          python -m pip install --no-deps -e .
          python -m pip install --disable-pip-version-check build twine
      - name: Install hash-pinned build verifier parser
        run: >-
          python -m pip install --require-hashes --only-binary=:all: --no-deps -r deploy/build/verification-runtime.requirements.txt
      - name: Run release verification
        run: make PYTHON=python check
      - name: Build and validate artifacts
        run: |
          python -m build
          python -m twine check dist/*
      - name: Smoke-test the wheel outside the checkout
        run: |
          python -m venv "${RUNNER_TEMP}/mra-wheel-smoke"
          "${RUNNER_TEMP}/mra-wheel-smoke/bin/python" -m pip install --disable-pip-version-check -r requirements.lock
          "${RUNNER_TEMP}/mra-wheel-smoke/bin/python" -m pip install --no-deps dist/*.whl
          cd "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/mra-wheel-smoke/bin/mra" --version
          "${RUNNER_TEMP}/mra-wheel-smoke/bin/mra" validate "${GITHUB_WORKSPACE}/examples/request.json"
          "${RUNNER_TEMP}/mra-wheel-smoke/bin/mra" schema --output "${RUNNER_TEMP}/assessment-request.json"
      - uses: actions/upload-artifact@v4
        with:
          name: model-release-assurance-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --draft --verify-tag --generate-notes --title "${{ github.ref_name }}"
