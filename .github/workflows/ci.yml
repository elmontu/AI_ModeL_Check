name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  formal:
    name: Lean protocol proof
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and audit Lean proof terms
        uses: leanprover/lean-action@v1.6.0
        with:
          lake-package-directory: formal/lean
          auto-config: false
          build: true
          test: false
          lint: false
          axiom-audit: true
          axiom-audit-root: MRAP
          axiom-audit-allow: propext,Quot.sound
      - name: Verify theorem inventory and toolchain boundary
        run: python scripts/verify_formal_protocol.py

  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install locked runtime
        run: python -m pip install --disable-pip-version-check -r requirements.lock
      - name: Install experiment test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-experiments.txt
      - name: Install package without resolving dependencies
        run: python -m pip install --no-deps -e .
      - name: Compile, test, and replay schemas
        run: make PYTHON=python check

  package:
    name: Build distribution
    needs: [formal, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tools
        run: python -m pip install --disable-pip-version-check build twine
      - name: Build and validate artifacts
        run: |
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-distribution
          path: dist/*
          if-no-files-found: error
