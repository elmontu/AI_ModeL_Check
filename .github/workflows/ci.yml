name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install locked runtime
        run: python -m pip install --disable-pip-version-check -r requirements.lock
      - name: Install experiment test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-experiments.txt
      - name: Install package without resolving dependencies
        run: python -m pip install --no-deps -e .
      - name: Compile, test, and replay schemas
        run: make PYTHON=python check

  package:
    name: Build distribution
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tools
        run: python -m pip install --disable-pip-version-check build twine
      - name: Build and validate artifacts
        run: |
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-distribution
          path: dist/*
          if-no-files-found: error
