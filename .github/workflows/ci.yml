name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline-bootstrap:
    name: Pipeline setup (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-path: .local/pipeline-ci/bin/python
            build-profile: linux
          - os: windows-latest
            python-path: .local/pipeline-ci/Scripts/python.exe
            build-profile: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: runner.os != 'Windows'
        with:
          python-version: "3.12.14"
      - name: Provision the pinned Windows CI interpreter
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $runtimeRoot = Join-Path $env:RUNNER_TEMP 'mra-cpython-3.12.14-20260901'
          if (Test-Path -LiteralPath $runtimeRoot) { throw 'CI interpreter destination already exists' }
          New-Item -ItemType Directory -Path $runtimeRoot | Out-Null
          $archive = Join-Path $runtimeRoot 'runtime.tar.gz'
          $url = 'https://github.com/astral-sh/python-build-standalone/releases/download/20260901/cpython-3.12.14%2B20260901-x86_64-pc-windows-msvc-install_only.tar.gz'
          $expectedHash = 'e90c1b6419da3bd812dd73bb3de40287a21abf153438147639ec5e20375ea93f'
          Invoke-WebRequest -Uri $url -OutFile $archive -TimeoutSec 120
          if ((Get-Item -LiteralPath $archive).Length -ne 46184075) { throw 'CI interpreter archive size mismatch' }
          $observedHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($observedHash -ne $expectedHash) { throw 'CI interpreter archive digest mismatch' }
          $entries = & tar -tzf $archive
          if ($LASTEXITCODE -ne 0) { throw 'CI interpreter archive inventory failed' }
          foreach ($entry in $entries) {
              $parts = $entry.Replace([char]92, [char]47).Split('/')
              if ($entry.StartsWith('/') -or $entry -match '^[A-Za-z]:' -or $parts -contains '..' -or $parts[0] -ne 'python') {
                  throw 'CI interpreter archive path rejected'
              }
          }
          & tar -xzf $archive -C $runtimeRoot
          if ($LASTEXITCODE -ne 0) { throw 'CI interpreter extraction failed' }
          $pythonDirectory = Join-Path $runtimeRoot 'python'
          $pythonExecutable = Join-Path $pythonDirectory 'python.exe'
          $observed = & $pythonExecutable -I -S -B -c 'import json, platform, struct; print(json.dumps({"implementation": platform.python_implementation(), "version": platform.python_version(), "bits": struct.calcsize("P") * 8}))'
          if ($LASTEXITCODE -ne 0) { throw 'CI interpreter verification failed' }
          $runtime = $observed | ConvertFrom-Json
          if ($runtime.implementation -ne 'CPython' -or $runtime.version -ne '3.12.14' -or $runtime.bits -ne 64) {
              throw 'CI interpreter version or architecture mismatch'
          }
          $pythonDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          (Join-Path $pythonDirectory 'Scripts') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          New-Item -ItemType Directory -Path '.local' -Force | Out-Null
          @{
              schema = 'mra-ci-python-provenance/1'
              publisher = 'Astral python-build-standalone'
              release = '20260901'
              url = $url
              archive_bytes = 46184075
              archive_sha256 = $observedHash
              executable_sha256 = (Get-FileHash -LiteralPath $pythonExecutable -Algorithm SHA256).Hash.ToLowerInvariant()
              runtime = $runtime
              scope = 'CI test toolchain'
          } | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath '.local/ci-python-provenance.json' -Encoding utf8
      - name: Bootstrap a fresh training environment
        run: python scripts/setup_pipeline.py --profile console --venv .local/pipeline-ci
      - name: Install hash-pinned build verifier parser
        shell: bash
        run: >-
          ${{ matrix.python-path }} -m pip install --require-hashes --only-binary=:all: --no-deps -r deploy/build/verification-runtime.requirements.txt
      - name: Verify public wheel bundle and current dependency advisories
        shell: bash
        run: ${{ matrix.python-path }} -B scripts/verify_build_supply_chain.py --manifest deploy/build/${{ matrix.build-profile }}-cp312.json --download --scan-pypi --output .local/ci-supply-chain
      - name: Retain public dependency inventory and advisory evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-supply-chain-${{ matrix.os }}-${{ github.run_attempt }}
          path: |
            .local/ci-supply-chain/*.json
            .local/ci-python-provenance.json
          include-hidden-files: true
          if-no-files-found: error
      - name: Run required government profile without skips
        shell: bash
        run: ${{ matrix.python-path }} -B scripts/run_required_tests.py --profile government --output .local/ci-required
      - name: Report required test failures
        if: failure()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path(".local/ci-required/result.json")
          if path.is_file():
              result = json.loads(path.read_text(encoding="utf-8"))
              for field in ("discovery_problems", "failures", "errors", "skips", "expected_failures", "unexpected_successes"):
                  for item in result.get(field, []):
                      detail = (str(item.get("test_id", "")) + "\n" + str(item.get("reason", ""))) if isinstance(item, dict) else str(item)
                      message = (field + ": " + detail).replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                      print("::error title=Required government test failure::" + message)
          PY
      - name: Require complete government test evidence
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import stat

          evidence = Path(".local/ci-required")
          for name in ("tests.log", "result.json"):
              path = evidence / name
              try:
                  info = path.lstat()
              except FileNotFoundError:
                  raise SystemExit(f"Required test evidence is missing: {path}")
              if (not stat.S_ISREG(info.st_mode) or info.st_size == 0
                      or getattr(info, "st_file_attributes", 0) & 0x400):
                  raise SystemExit(f"Required test evidence must be a nonempty regular file: {path}")
          result = json.loads((evidence / "result.json").read_text(encoding="utf-8"))
          if (not isinstance(result, dict) or result.get("profile") != "government"
                  or result.get("status") not in {"passed", "failed"}):
              raise SystemExit("Required test evidence has an invalid profile or status")
          PY
      - name: Retain required government test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-government-required-${{ matrix.os }}-${{ github.run_attempt }}
          path: |
            .local/ci-required/tests.log
            .local/ci-required/result.json
          include-hidden-files: true
          if-no-files-found: error
      - name: Rehearse local public-fixture deployment
        shell: bash
        run: ${{ matrix.python-path }} -B scripts/rehearse_local_deployment.py --output .local/ci-deployment-rehearsal
      - name: Retain local deployment rehearsal result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-local-deployment-rehearsal-${{ matrix.os }}-${{ github.run_attempt }}
          path: .local/ci-deployment-rehearsal/result.json
          include-hidden-files: true
          if-no-files-found: error
      - name: Run the offline training workflow
        shell: bash
        run: ${{ matrix.python-path }} -m model_release_assurance.workflow demo --output output/pipeline-ci-demo
      - name: Validate every local training option and adversary
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: ${{ matrix.python-path }} scripts/validate_framework_e2e.py --output output/framework-e2e-ci
      - name: Retain local workflow test matrix and evidence
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: framework-e2e-matrix
          path: output/framework-e2e-ci/
          if-no-files-found: warn

  formal:
    name: Lean protocol proof
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and audit Lean proof terms
        uses: leanprover/lean-action@v1.6.0
        with:
          lake-package-directory: formal/lean
          auto-config: false
          build: true
          test: false
          lint: false
          axiom-audit: true
          axiom-audit-root: MRAP
          axiom-audit-allow: propext,Quot.sound
      - name: Verify theorem inventory and toolchain boundary
        run: python scripts/verify_formal_protocol.py

  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install locked runtime
        run: python -m pip install --disable-pip-version-check -r requirements.lock
      - name: Install experiment test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-experiments.txt
      - name: Install console test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-console.txt
      - name: Install package without resolving dependencies
        run: python -m pip install --no-deps -e .
      - name: Install hash-pinned build verifier parser
        run: >-
          python -m pip install --require-hashes --only-binary=:all: --no-deps -r deploy/build/verification-runtime.requirements.txt
      - name: Compile, test, and replay schemas
        shell: bash
        run: |
          mkdir -p .local
          set -o pipefail
          make PYTHON=python check 2>&1 | tee .local/ci-check.log
      - name: Report Python check failures
        if: failure()
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path(".local/ci-check.log")
          if path.is_file():
              text = path.read_text(encoding="utf-8", errors="replace")
              blocks = [block for block in text.split("=" * 70) if block.lstrip().startswith(("FAIL:", "ERROR:"))]
              for detail in blocks or ["\n".join(text.splitlines()[-80:])]:
                  message = detail.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                  print("::error title=Python CI check failure::" + message)
          PY

  training-release-demo:
    name: Training-to-assessment demo (offline dataset)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install core and experiment dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.lock
          python -m pip install --disable-pip-version-check -r requirements-experiments.txt
          python -m pip install --no-deps -e .
      - name: Verify the real-training pipeline and failure boundaries
        env:
          PYTHONPATH: src
        run: python -m unittest tests.test_training_release_demo -v
      - name: Train, export, test, and assess one candidate
        env:
          PYTHONPATH: src
        run: >-
          python scripts/run_training_release_demo.py
          --dataset-profile sklearn-breast-cancer
          --run-dir "${RUNNER_TEMP}/mra-training-release-demo"

  demo-reference:
    name: Reference fixture rehearsal (core only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install locked core runtime
        run: |
          python -m pip install --disable-pip-version-check -r requirements.lock
          python -m pip install --no-deps -e .
      - name: Verify the guided demo contract and failure branches
        env:
          PYTHONPATH: src
        run: python -m unittest tests.test_government_health_demo -v
      - name: Run the nontechnical journey
        env:
          PYTHONPATH: src
        run: >-
          python scripts/run_government_health_demo.py
          --output-root "${RUNNER_TEMP}/mra-government-health-demo"
          --run-id ci

  training-hook-runtime:
    name: Training-hook contracts (CPU, no downloads)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install CPU-only PyTorch and torchvision
        run: >-
          python -m pip install --disable-pip-version-check
          --index-url https://download.pytorch.org/whl/cpu
          'torch>=2.13,<2.14' 'torchvision>=0.28,<0.29'
      - name: Install LLM and vision hook dependencies
        run: python -m pip install --disable-pip-version-check -e '.[llm-experiments,vision-experiments]'
      - name: Run bounded hook and worker contract tests
        env:
          PYTHONPATH: src
        run: |
          python -m unittest discover -s tests -p 'test_llm_training_hooks.py' -v
          python -m unittest discover -s tests -p 'test_llm_training_worker.py' -v
          python -m unittest discover -s tests -p 'test_vision_training_worker.py' -v
          python -m unittest discover -s tests -p 'test_llm_composition_scaling.py' -v
          python -m unittest discover -s tests -p 'test_vision_composition_scaling.py' -v
          python -m unittest discover -s tests -p 'test_composition_scaling_suite.py' -v

  package:
    name: Build distribution
    needs: [pipeline-bootstrap, formal, test, training-hook-runtime, training-release-demo, demo-reference]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tools
        run: |
          python -m pip install --disable-pip-version-check -r requirements.lock
          python -m pip install --disable-pip-version-check build twine
      - name: Build and validate artifacts
        run: |
          python -m build
          python -m twine check dist/*
      - name: Smoke-test the wheel outside the checkout
        run: |
          python -m venv "${RUNNER_TEMP}/mra-wheel-smoke"
          "${RUNNER_TEMP}/mra-wheel-smoke/bin/python" -m pip install --disable-pip-version-check -r requirements.lock
          "${RUNNER_TEMP}/mra-wheel-smoke/bin/python" -m pip install --no-deps dist/*.whl
          cd "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/mra-wheel-smoke/bin/mra" --version
          "${RUNNER_TEMP}/mra-wheel-smoke/bin/mra-export" catalog
          "${RUNNER_TEMP}/mra-wheel-smoke/bin/mra" validate "${GITHUB_WORKSPACE}/examples/request.json"
          "${RUNNER_TEMP}/mra-wheel-smoke/bin/mra" schema --output "${RUNNER_TEMP}/assessment-request.json"
      - uses: actions/upload-artifact@v4
        with:
          name: python-distribution
          path: dist/*
          if-no-files-found: error
