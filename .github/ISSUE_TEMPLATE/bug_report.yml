name: Bug report
description: Report a reproducible defect using synthetic or public data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include confidential data, credentials, private keys, model artifacts, or vulnerability details. Use GitHub private vulnerability reporting for security issues.
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Contracts or schemas
        - Assessment core
        - Selection or certificates
        - Protocol-feasibility certificates
        - MRAP transcript verification
        - Lean or formal verification
        - Integrity or audit
        - CLI or packaging
        - Evidence lab or model worker
        - MCP or retrieval integration
        - Documentation or CI
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal synthetic reproduction
      render: shell
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      render: text
