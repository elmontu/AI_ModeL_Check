[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "model-release-assurance"
dynamic = ["version"]
description = "Release-enabling assurance optimizer with a fail-safe gate for whole-of-government model releases"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["assurance", "governance", "machine-learning", "privacy", "security"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Government",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Typing :: Typed",
]
dependencies = [
  "cryptography>=42",
  "pydantic>=2.7",
]

[project.optional-dependencies]
portfolio = [
  "scipy>=1.13",
]
experiments = [
  "joblib>=1.4",
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=17",
  "scikit-learn>=1.5",
  "scipy>=1.13",
  "xgboost>=2.1",
]
mcp = [
  "mcp>=2,<3",
]
privacy-experiments = [
  "torch>=2.13",
]

[project.scripts]
mra = "model_release_assurance.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "model_release_assurance.version.VERSION"}

[tool.setuptools.package-data]
model_release_assurance = ["py.typed"]
