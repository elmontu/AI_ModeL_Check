[project]
name = "ai-safety-checker"
version = "0.1.0"
requires-python = ">=3.10"
description = "Practical, runnable AI model safety checks — from deep learning to LLMs"
license = "MIT"
readme = "README.md"

dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
data = [
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "pandas>=2.0",
    "scipy>=1.11",
    "scikit-learn>=1.3",
]
adversarial = [
    "adversarial-robustness-toolbox>=1.17",
    "torch>=2.0",
    "numpy>=1.24",
]
fairness = [
    "fairlearn>=0.10",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "numpy>=1.24",
]
interpretability = [
    "shap>=0.45",
    "lime>=0.2",
    "numpy>=1.24",
]
privacy = [
    "adversarial-robustness-toolbox>=1.17",
    "numpy>=1.24",
]
llm = [
    "detoxify>=0.5",
    "presidio-analyzer>=2.2",
    "openai>=1.0",
    "httpx>=0.25",
]
governance = [
    "jinja2>=3.1",
    "pandas>=2.0",
]
all = [
    "ai-safety-checker[data,adversarial,fairness,interpretability,privacy,llm,governance]",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[project.scripts]
aisafety = "aisafety.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aisafety"]

[tool.pytest.ini_options]
testpaths = ["tests"]
