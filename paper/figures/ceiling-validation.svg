<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="687" viewBox="0 0 1280 687" role="img" aria-labelledby="title desc">
<title id="title">Finite-channel ceiling validation</title>
<desc id="desc">Exact oracle risk points shown against controlled and model-conditional mean intervals. Triangles mark model-conditional 95th-percentile ceilings. A dashed vertical line marks the MRA tolerance of 0.65.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<style>text{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.title{font-size:25px;font-weight:700}.subtitle{font-size:14px;fill:#536079}.label{font-size:13px}.label.fail{fill:#b42318;font-weight:700}.tick{font-size:12px;fill:#667085}.section{font-size:12px;font-weight:700;letter-spacing:.08em}.legend{font-size:12px}</style>
<text class="title" x="32" y="40">Ceiling validation against exact oracle risk</text>
<text class="subtitle" x="32" y="66">Line = mean [floor, ceiling]; dot = exact risk R*; triangle = p95 ceiling; dashed line = tolerance 0.65</text>
<line x1="32" y1="91" x2="54" y2="91" stroke="#1769aa" stroke-width="5" stroke-linecap="round"/>
<text class="legend" x="62" y="95">controlled mean interval</text>
<line x1="232" y1="91" x2="254" y2="91" stroke="#7a3db8" stroke-width="5" stroke-linecap="round"/>
<text class="legend" x="262" y="95">model-conditional mean interval</text>
<circle cx="503" cy="91" r="5" fill="#111827"/>
<text class="legend" x="514" y="95">exact oracle risk</text>
<polygon points="654,84 648,96 660,96" fill="#7a3db8"/>
<text class="legend" x="669" y="95">model p95 ceiling</text>
<line x1="440.00" y1="125" x2="440.00" y2="567" stroke="#e4e7ec" stroke-width="1"/>
<text class="tick" x="440.00" y="595" text-anchor="middle">0.5</text>
<line x1="594.00" y1="125" x2="594.00" y2="567" stroke="#e4e7ec" stroke-width="1"/>
<text class="tick" x="594.00" y="595" text-anchor="middle">0.6</text>
<line x1="748.00" y1="125" x2="748.00" y2="567" stroke="#e4e7ec" stroke-width="1"/>
<text class="tick" x="748.00" y="595" text-anchor="middle">0.7</text>
<line x1="902.00" y1="125" x2="902.00" y2="567" stroke="#e4e7ec" stroke-width="1"/>
<text class="tick" x="902.00" y="595" text-anchor="middle">0.8</text>
<line x1="1056.00" y1="125" x2="1056.00" y2="567" stroke="#e4e7ec" stroke-width="1"/>
<text class="tick" x="1056.00" y="595" text-anchor="middle">0.9</text>
<line x1="1210.00" y1="125" x2="1210.00" y2="567" stroke="#e4e7ec" stroke-width="1"/>
<text class="tick" x="1210.00" y="595" text-anchor="middle">1.0</text>
<line x1="671.00" y1="117" x2="671.00" y2="567" stroke="#d1495b" stroke-width="2" stroke-dasharray="7 5"/>
<text class="tick" x="678.00" y="113" fill="#b42318">tolerance 0.65</text>
<text class="section" x="32" y="128" fill="#1769aa">CONTROLLED EXACT GROUND TRUTH</text>
<text class="label" x="32" y="150">Controlled · XGBoost label · SAFE</text>
<line x1="441.24" y1="145" x2="610.94" y2="145" stroke="#1769aa" stroke-width="6" stroke-linecap="round"/>
<line x1="441.24" y1="138" x2="441.24" y2="152" stroke="#1769aa" stroke-width="2"/>
